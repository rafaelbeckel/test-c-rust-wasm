[package]
edition = "2024"
name = "wasm32-libc"
version = "0.3.0"
links = "wasm32-libc"
description = "Musl libc for wasm32-unknown-unknown."
readme = "README.md"
keywords = ["libc"]
license = "BSD-3-Clause AND ISC AND MIT"
repository = "https://git.musl-libc.org/cgit/musl"

[lib]
path = "src/lib.rs"

[dependencies]
portable-atomic = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
cc = { workspace = true }
bindgen = { workspace = true }
cfg_aliases = { workspace = true }
