[package]
edition = "2024"
name = "wasm32-libc"
version = "0.4.0"
links = "wasm32-libc"
description = "musl libc compiled for wasm32-unknown-unknown, with a Rust-backed allocator."
readme = "README.md"
keywords = ["libc", "musl", "wasm"]
# musl is MIT. src/malloc.rs is Blue Oak Model Licence 1.0.0. See THIRD-PARTY.md.
license = "MIT AND BlueOak-1.0.0"
repository = "https://github.com/rafaelbeckel/test-c-rust-wasm"

[lib]
path = "src/lib.rs"

[build-dependencies]
cc = { workspace = true }
cfg_aliases = { workspace = true }
