[package]
edition = "2024"
name = "wasm32-libcxx"
version = "0.1.0"
links = "wasm32-libcxx"
description = "LLVM libc++ for wasm32-unknown-unknown, built on musl."
readme = "README.md"
keywords = ["libcxx"]
# LLVM libc++ and libc++abi, taken from emscripten. See THIRD-PARTY.md.
license = "Apache-2.0 WITH LLVM-exception AND MIT"
repository = "https://github.com/rafaelbeckel/test-c-rust-wasm"

[dependencies]
wasm32-libc = { path = "../wasm32-libc" }

[build-dependencies]
cc = { workspace = true }
