name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel in-progress runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Build, Lint, Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # We don't use `submodules: true` here — setup.sh does sparse checkout
        # for emscripten (large repo), which the standard checkout can't do.

      - name: Install LLVM 19 (clang + lld) and wabt
        env:
          LLVM_VERSION: "19"
        run: |
          # Ubuntu's default clang/lld lag behind what emscripten's libcxx
          # headers need (e.g. crate 8 fails on clang 18 with template
          # errors in <type_traits>). Use LLVM's official apt repo for a
          # newer toolchain.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              wget gnupg software-properties-common wabt
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends "lld-$LLVM_VERSION"
          # The default `clang` is a real binary, not an `update-alternatives`
          # link, so just symlink the new versions on top of /usr/local/bin
          # (which is earlier on PATH than /usr/bin).
          sudo ln -sf "/usr/bin/clang-$LLVM_VERSION"   /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$LLVM_VERSION" /usr/local/bin/clang++
          sudo ln -sf "/usr/bin/wasm-ld-$LLVM_VERSION" /usr/local/bin/wasm-ld
          # Sanity check.
          clang --version
          clang++ --version
          wasm-ld --version

      - name: Install Rust stable (workspace default)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Rust nightly (only used by crates/6_extern_types)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Cache Cargo & target dirs
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Initialize submodules (musl, emscripten libcxx, zlib)
        run: ./setup.sh

      # ── Lint ──────────────────────────────────────────────────────────
      - name: cargo fmt (all crates)
        run: cargo fmt --all --check

      - name: cargo clippy (workspace, stable)
        run: >
          cargo clippy
          --workspace --exclude ext_t_calculator
          --all-targets
          -- -D warnings

      - name: cargo clippy (crate 6, nightly)
        working-directory: crates/6_extern_types
        run: cargo clippy --all-targets -- -D warnings

      # ── Host tests ────────────────────────────────────────────────────
      - name: cargo test (workspace, stable)
        run: cargo test --workspace --exclude ext_t_calculator

      - name: cargo test (crate 6, nightly)
        working-directory: crates/6_extern_types
        run: cargo test

      # ── Build all 9 crates for wasm32-unknown-unknown ─────────────────
      - name: Build all crates (build_all.sh)
        run: ./build_all.sh
