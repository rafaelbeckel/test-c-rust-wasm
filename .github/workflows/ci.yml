name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel in-progress runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Build, Lint, Test
    runs-on: ubuntu-latest
    # A cold cache compiles 561 C files into the C library (twice, since
    # stable and nightly each build 3rd-party/wasm32-libc) and 74 libc++
    # translation units, on top of the LLVM 19 install, two Rust toolchains,
    # and the host lint and test passes. 45 minutes covers that with room to
    # spare, and a warm cache finishes in a fraction of it.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # `submodules: true` is deliberately not used. setup.sh does a partial
        # clone and sparse checkout of 3rd-party/emscripten, which is a 1+ GB
        # repository that the standard checkout would pull in full.

      # ── Guard ─────────────────────────────────────────────────────────
      # Runs before anything expensive, so a bad reference fails in seconds.
      - name: Check for forbidden references
        run: |
          # The C library here is musl v1.2.6, and the allocator design is
          # credited to @savage13. Two other names must appear nowhere in this
          # tree, and the patterns below are what keeps them out.
          #
          # Two details make the check reliable:
          #   * The character classes stop the patterns from matching this
          #     step's own text, and the failure message below spells out
          #     neither name, so the guard cannot trip on itself.
          #   * `git grep` reads tracked files only and does not descend into
          #     submodules, so vendored sources are already out of scope. The
          #     pathspecs say so explicitly all the same. 3rd-party/wasm32-libc
          #     and 3rd-party/wasm32-libcxx are ours and stay in scope.
          if git grep -I -n -i -e 'openbs[d]' -e 'trevy[n]' -- \
              ':!3rd-party/musl' \
              ':!3rd-party/emscripten' \
              ':!crates/9_capstone/zlib'; then
            echo ""
            echo "The lines above carry a name this repository does not allow."
            echo "Write what the code is: musl v1.2.6 is the C standard library,"
            echo "and @savage13 is the credit for the allocator that gives C and"
            echo "Rust one shared heap."
            exit 1
          fi
          echo "Clean."

      - name: Install LLVM 19 (clang + lld) and wabt
        env:
          LLVM_VERSION: "19"
        run: |
          # Ubuntu's default clang/lld lag behind what emscripten's libcxx
          # headers need (e.g. crate 8 fails on clang 18 with template
          # errors in <type_traits>). Use LLVM's official apt repo for a
          # newer toolchain.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              wget gnupg software-properties-common wabt
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends "lld-$LLVM_VERSION"
          # The default `clang` is a real binary, not an `update-alternatives`
          # link, so just symlink the new versions on top of /usr/local/bin
          # (which is earlier on PATH than /usr/bin).
          sudo ln -sf "/usr/bin/clang-$LLVM_VERSION"   /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$LLVM_VERSION" /usr/local/bin/clang++
          sudo ln -sf "/usr/bin/wasm-ld-$LLVM_VERSION" /usr/local/bin/wasm-ld
          # Sanity check.
          clang --version
          clang++ --version
          wasm-ld --version

      - name: Install Rust stable (workspace default)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Rust nightly (only used by crates/6_extern_types)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install Node (runs tests/smoke.mjs)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Cargo & target dirs
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      # Fetches 3rd-party/musl, 3rd-party/emscripten (partial clone plus
      # sparse checkout) and crates/9_capstone/zlib.
      - name: Initialize submodules (setup.sh)
        run: ./setup.sh

      # ── Lint ──────────────────────────────────────────────────────────
      - name: cargo fmt (all crates)
        run: cargo fmt --all --check

      - name: cargo clippy (workspace, stable)
        run: >
          cargo clippy
          --workspace --exclude ext_t_calculator
          --all-targets
          -- -D warnings

      - name: cargo clippy (crate 6, nightly)
        working-directory: crates/6_extern_types
        run: cargo clippy --all-targets -- -D warnings

      # ── Host tests ────────────────────────────────────────────────────
      - name: cargo test (workspace, stable)
        run: cargo test --workspace --exclude ext_t_calculator

      - name: cargo test (crate 6, nightly)
        working-directory: crates/6_extern_types
        run: cargo test

      # ── Build all 9 crates for wasm32-unknown-unknown ─────────────────
      - name: Build all crates (build_all.sh)
        run: ./build_all.sh

      # ── Run every binary that build_all.sh produced ───────────────────
      - name: Smoke test the wasm binaries (tests/smoke.mjs)
        run: node tests/smoke.mjs
