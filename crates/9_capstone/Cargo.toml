[package]
name = "zlib_compression"
version = "0.1.0"
edition = "2024"
links = "zlib"
description = "Capstone: integrate a real external C library (zlib) for WASM compression"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm32-libc = { path = "../../3rd-party/wasm32-libc" }

[build-dependencies]
cc = { workspace = true }
